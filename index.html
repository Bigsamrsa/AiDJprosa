<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BuildAI DJ - FINAL FULL VIDEO BG</title><script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiQnVpbGRBSSBWaWRlbyBEaiIsInNob3J0X25hbWUiOiJWaWRlbyBEaiIsImRpc3BsYXkiOiJzdGFuZGFsb25lIn0=">
<meta name="theme-color" content="#FFD600">
<style>.video-box{position:relative;aspect-ratio:16/9;background:#111;border-radius:12px;overflow:hidden}.active{border-color:#FFD600!important}</style>
</head>
<body class="bg-black text-white p-2 pb-28">

<h1 class="font-black text-yellow-400 text-lg flex justify-between">BuildAI DJ FULL 🤖<span class="text-[9px] bg-yellow-400 text-black px-2 py-1 rounded-full">FINAL V7 VIDEO BG</span></h1>

<!-- BG + INSTALL -->
<div class="bg-yellow-400 text-black p-3 rounded-2xl mt-2 font-black">
<div class="flex justify-between text-[11px]"><span>🔊 BG PLAY</span><span id="bgStatus">TAP ENABLE</span></div>
<div class="grid grid-cols-2 gap-2 mt-2"><button onclick="enableBG()" id="bgBtn" class="bg-black text-yellow-400 py-3 rounded-full text-[11px] font-black">🔊 ENABLE BG + LOCK</button><button onclick="install()" class="bg-white text-black py-3 rounded-full text-[11px] font-black">📲 INSTALL APP</button></div>
</div>

<!-- VIDEO DECKS - DISPLAYS 100% -->
<div class="grid grid-cols-2 gap-2 mt-3">
<div id="boxA" class="video-box border-2 border-yellow-400 active"><iframe id="iframeA" class="w-full h-full" src="https://www.youtube.com/embed/jfKfPfyJRdk?playsinline=1" frameborder="0" allow="autoplay"></iframe><video id="videoA" class="hidden absolute inset-0 w-full h-full" controls playsinline></video><div class="absolute bottom-1 left-1 bg-black/80 px-2 py-1 rounded-full text-[8px] font-black">DECK A • <span id="bpmA">100 BPM</span></div></div>
<div id="boxB" class="video-box border-2 border-zinc-700"><iframe id="iframeB" class="w-full h-full" src="https://www.youtube.com/embed/9bZkp7q19f0?playsinline=1" frameborder="0" allow="autoplay"></iframe><video id="videoB" class="hidden absolute inset-0 w-full h-full" controls playsinline></video><div class="absolute bottom-1 left-1 bg-black/80 px-2 py-1 rounded-full text-[8px] font-black">DECK B • <span id="bpmB">100 BPM</span></div></div>
</div>

<!-- MASTER MIX -->
<div class="bg-zinc-900 rounded-2xl p-2 mt-3 border-2 border-yellow-400">
<div class="flex justify-between text-[10px] font-black"><span class="text-yellow-400">🔴 MASTER VIDEO MIX</span><span id="recStatus">● READY</span></div>
<div class="relative aspect-video bg-black rounded-xl overflow-hidden mt-1">
<div id="mLayerA" class="absolute inset-0"><iframe id="mIframeA" class="w-full h-full" src="https://www.youtube.com/embed/jfKfPfyJRdk?mute=1" frameborder="0"></iframe><video id="mVideoA" class="hidden w-full h-full"></video></div>
<div id="mLayerB" class="absolute inset-0" style="opacity:0.5"><iframe id="mIframeB" class="w-full h-full" src="https://www.youtube.com/embed/9bZkp7q19f0?mute=1" frameborder="0"></iframe><video id="mVideoB" class="hidden w-full h-full"></video></div>
<div id="mixLabel" class="absolute bottom-1 left-1/2 -translate-x-1/2 bg-yellow-400 text-black px-3 py-1 rounded-full text-[9px] font-black">MIX 50/50</div>
</div>
<!-- AUDIO DECKS HIDDEN FOR BG -->
<audio id="deckA" class="hidden"></audio><audio id="deckB" class="hidden"></audio>
</div>

<!-- VIDEO CROSSFADER -->
<div class="bg-zinc-900 p-3 rounded-2xl mt-3">
<div class="flex justify-between text-[9px] opacity-60"><span>DECK A</span><span>VIDEO + AUDIO CROSSFADER</span><span>DECK B</span></div>
<input id="xf" type="range" min="0" max="100" value="50" class="w-full accent-yellow-400 h-5 mt-1" oninput="mix(this.value)">
<div class="grid grid-cols-3 gap-2 mt-2">
<button onclick="mix(0)" class="bg-yellow-400 text-black py-2 rounded-full text-[10px] font-black">◀ ONLY A</button>
<button onclick="autoMix()" class="bg-white text-black py-2 rounded-full text-[10px] font-black">⚡ AUTO 8s</button>
<button onclick="mix(100)" class="bg-zinc-800 py-2 rounded-full text-[10px] font-black">ONLY B ▶</button>
</div>
<div class="grid grid-cols-4 gap-2 mt-3">
<button onclick="playAll()" class="bg-yellow-400 text-black py-3 rounded-xl font-black text-[11px]">▶ PLAY</button>
<button onclick="pauseAll()" class="bg-zinc-800 py-3 rounded-xl font-black text-[11px]">⏸</button>
<button onclick="swap()" class="bg-zinc-800 py-3 rounded-xl font-black text-[11px]">🔄 SWAP</button>
<button onclick="rec()" id="recBtn" class="bg-red-600 py-3 rounded-xl font-black text-[11px]">● REC</button>
</div>
<p id="status" class="text-[11px] text-yellow-400 text-center mt-2">FINAL FULL READY - BG + VIDEO</p>
</div>

<!-- LOAD -->
<div class="bg-zinc-900 p-3 rounded-2xl mt-3 border border-zinc-700">
<p class="text-xs font-black text-yellow-400">🎸 LOAD VIDEOS + MP3</p>
<input id="ytInput" class="w-full p-3 rounded-xl bg-black border border-zinc-700 text-xs mt-2" placeholder="YouTube link">
<div class="grid grid-cols-2 gap-2 mt-2"><button onclick="loadYT('A')" class="bg-yellow-400 text-black py-2 rounded-full font-black text-[11px]">YT → A</button><button onclick="loadYT('B')" class="bg-zinc-800 py-2 rounded-full font-black text-[11px]">YT → B</button></div>
<div class="grid grid-cols-2 gap-2 mt-2"><button onclick="fileA.click()" class="bg-black border border-yellow-400 py-2 rounded-full text-[10px]">📁 VIDEO/MP3 A</button><button onclick="fileB.click()" class="bg-black border border-zinc-600 py-2 rounded-full text-[10px]">📁 VIDEO/MP3 B</button></div>
<input type="file" id="fileA" accept="video/*,audio/*" hidden><input type="file" id="fileB" accept="video/*,audio/*" hidden>
<!-- EFFECTS -->
<div class="grid grid-cols-4 gap-2 mt-3">
<button onclick="fx('guitar')" class="bg-black border border-yellow-400 py-2 rounded-full text-[10px]">🎸 Guitar 72%</button>
<button onclick="fx('concertina')" class="bg-black border border-yellow-400 py-2 rounded-full text-[10px]">🪗 Concert</button>
<button onclick="fx('bass')" class="bg-black border border-yellow-400 py-2 rounded-full text-[10px]">🥁 Bass 60%</button>
<button onclick="fx('log')" class="bg-yellow-400 text-black py-2 rounded-full text-[10px] font-black">🥁 LogDrum</button>
</div>
<div class="grid grid-cols-2 gap-2 mt-2">
<button onclick="shareWA()" class="bg-green-600 py-2 rounded-full text-[10px] font-bold">💬 Share WhatsApp</button>
<button onclick="toggleSync()" id="syncBtn" class="bg-zinc-800 py-2 rounded-full text-[10px]">🔗 SYNC 100 BPM ON</button>
</div>
</div>

<script>
// BG + PWA
let deferredPrompt=null; window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
function install(){if(deferredPrompt)deferredPrompt.prompt(); else alert('Menu ⋮ > Add to Home Screen');}
function enableBG(){
 if('mediaSession' in navigator){
  navigator.mediaSession.metadata=new MediaMetadata({title:'BuildAI VIDEO MIX FINAL',artist:'Maskandi 100 BPM LIVE',album:'BG Video Mix',artwork:[{src:'https://via.placeholder.com/512/FFD600/000000?text=VIDEO',sizes:'512x512',type:'image/png'}]});
  navigator.mediaSession.setActionHandler('play',playAll); navigator.mediaSession.setActionHandler('pause',pauseAll); navigator.mediaSession.setActionHandler('nexttrack',autoMix);
 }
 if('wakeLock' in navigator)navigator.wakeLock.request('screen').catch(()=>{});
 bgStatus.innerText='✅ BG ON'; bgBtn.innerText='✅ BG ENABLED'; status.innerText='🔊 BG ON - Minimize keeps playing!';
 if('serviceWorker' in navigator)navigator.serviceWorker.register(URL.createObjectURL(new Blob([`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());`],{type:'text/javascript'})));
}
let cross=50, deckA=document.getElementById('deckA'), deckB=document.getElementById('deckB'), isRec=false, recChunks=[], mediaRec=null, audioCtx=null, dest=null;
let videoA=document.getElementById('videoA'), videoB=document.getElementById('videoB'), mVideoA=document.getElementById('mVideoA'), mVideoB=document.getElementById('mVideoB');

function getId(u){let m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null;}
function loadYT(deck){
 let url=document.getElementById('ytInput').value.trim(); let id=getId(url); if(!id){status.innerText='❌ Bad link';return;}
 let iframe=deck=='A'?document.getElementById('iframeA'):document.getElementById('iframeB');
 let mIframe=deck=='A'?document.getElementById('mIframeA'):document.getElementById('mIframeB');
 let video=deck=='A'?videoA:videoB;
 video.classList.add('hidden'); iframe.classList.remove('hidden');
 iframe.src=`https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1`; mIframe.src=`https://www.youtube.com/embed/${id}?autoplay=1&mute=${deck=='A'?'0':'1'}&playsinline=1`;
 status.innerText='✅ Video '+deck+' loaded - DISPLAYS!'; enableBG();
}
document.getElementById('fileA').onchange=e=>{
 let f=e.target.files[0]; let url=URL.createObjectURL(f);
 if(f.type.startsWith('video')){videoA.src=url; mVideoA.src=url; videoA.classList.remove('hidden'); document.getElementById('iframeA').classList.add('hidden'); mVideoA.classList.remove('hidden'); document.getElementById('mIframeA').style.display='none'; videoA.play(); mVideoA.play();}
 else{deckA.src=url; deckA.play();}
 status.innerText='✅ A loaded: '+f.name.slice(0,20); enableBG();
}
document.getElementById('fileB').onchange=e=>{
 let f=e.target.files[0]; let url=URL.createObjectURL(f);
 if(f.type.startsWith('video')){videoB.src=url; mVideoB.src=url; videoB.classList.remove('hidden'); document.getElementById('iframeB').classList.add('hidden'); mVideoB.classList.remove('hidden'); document.getElementById('mIframeB').style.display='none'; videoB.play(); mVideoB.play();}
 else{deckB.src=url; deckB.play();}
 status.innerText='✅ B loaded: '+f.name.slice(0,20); enableBG();
}
function mix(v){
 cross=parseInt(v); let a=(100-cross)/100, b=cross/100;
 document.getElementById('mLayerA').style.opacity=a; document.getElementById('mLayerB').style.opacity=b;
 deckA.volume=a; deckB.volume=b; videoA.volume=a; videoB.volume=b;
 document.getElementById('mixLabel').innerText=`MIX ${Math.round(a*100)}% A / ${Math.round(b*100)}% B`;
 document.getElementById('boxA').classList.toggle('active',cross<50); document.getElementById('boxB').classList.toggle('active',cross>50);
}
function playAll(){enableBG(); videoA.play().catch(()=>{}); videoB.play().catch(()=>{}); mVideoA.play().catch(()=>{}); mVideoB.play().catch(()=>{}); deckA.play().catch(()=>{}); deckB.play().catch(()=>{}); if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'; status.innerText='▶ PLAYING - Drag to mix videos + BG on!';}
function pauseAll(){videoA.pause(); videoB.pause(); mVideoA.pause(); mVideoB.pause(); deckA.pause(); deckB.pause(); if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused';}
function swap(){mix(100-cross); document.getElementById('xf').value=100-cross;}
function autoMix(){let s=cross, t=s<50?100:0, p=0; let iv=setInterval(()=>{p+=2; if(p>=100)clearInterval(iv); let nv=s+(t-s)*(p/100); document.getElementById('xf').value=nv; mix(nv);},80);}
function fx(t){status.innerText='🎸 FX: '+t.toUpperCase()+' - 100 BPM'; if(t=='log'||t=='bass'){if(!audioCtx)audioCtx=new AudioContext(); let o=audioCtx.createOscillator(); o.frequency.value=t=='log'?55:80; let g=audioCtx.createGain(); g.gain.value=0.9; o.connect(g); g.connect(audioCtx.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.6);}}
function rec(){status.innerText='🔴 REC: Use phone screen recorder for video mix!';}
function shareWA(){window.open('https://wa.me/?text='+encodeURIComponent('🎬 BuildAI VIDEO MIX FINAL - '+location.href));}
function toggleSync(){status.innerText='🔗 SYNC 100 BPM ON';}
document.addEventListener('visibilitychange',()=>{if(document.hidden)enableBG();});
</script>
</body></html>
