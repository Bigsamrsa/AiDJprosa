<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BuildAI DJ - STOP OLD SONG FIXED</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-2 pb-24">
<h1 class="font-black text-yellow-400">BuildAI DJ - OLD SONG FIXED ✅</h1>

<div class="bg-yellow-400 text-black rounded-xl p-3 mt-2 font-black text-center">
<button onclick="enableBG()" id="bgBtn" class="bg-black text-yellow-400 w-full py-3 rounded-full">🔊 ENABLE BG PLAY</button>
<p id="bgStatus" class="text-[10px]">Tap first</p>
</div>

<div class="grid grid-cols-2 gap-2 mt-3">
<div class="bg-zinc-900 rounded-xl p-2 border-2 border-yellow-400">
<p class="text-[9px] font-black">DECK A - <span id="lblA">Demo A</span></p>
<div class="aspect-video bg-black rounded mt-1 overflow-hidden relative">
<iframe id="ytA" class="w-full h-full" src="https://www.youtube.com/embed/jfKfPfyJRdk?enablejsapi=1" frameborder="0"></iframe>
<video id="vidA" class="hidden w-full h-full absolute inset-0" controls playsinline loop></video>
</div>
<audio id="audA" class="hidden"></audio>
</div>
<div class="bg-zinc-900 rounded-xl p-2 border border-zinc-700">
<p class="text-[9px] font-black">DECK B - <span id="lblB">Demo B</span></p>
<div class="aspect-video bg-black rounded mt-1 overflow-hidden relative">
<iframe id="ytB" class="w-full h-full" src="https://www.youtube.com/embed/9bZkp7q19f0?enablejsapi=1" frameborder="0"></iframe>
<video id="vidB" class="hidden w-full h-full absolute inset-0" controls playsinline loop></video>
</div>
<audio id="audB" class="hidden"></audio>
</div>
</div>

<div class="bg-black border-2 border-yellow-400 rounded-xl p-2 mt-3">
<p class="text-[10px] font-black text-yellow-400">MASTER MIX</p>
<div class="relative aspect-video bg-zinc-900 rounded overflow-hidden mt-1">
<div id="layerA" class="absolute inset-0"><iframe id="mYtA" class="w-full h-full" src="https://www.youtube.com/embed/jfKfPfyJRdk?mute=1" frameborder="0"></iframe><video id="mVidA" class="hidden w-full h-full" muted loop playsinline></video></div>
<div id="layerB" class="absolute inset-0" style="opacity:0.5"><iframe id="mYtB" class="w-full h-full" src="https://www.youtube.com/embed/9bZkp7q19f0?mute=1" frameborder="0"></iframe><video id="mVidB" class="hidden w-full h-full" muted loop playsinline></video></div>
<div id="mixText" class="absolute bottom-1 left-1/2 -translate-x-1/2 bg-yellow-400 text-black px-3 py-1 rounded-full text-[10px] font-black">50/50</div>
</div>
</div>

<div class="bg-zinc-900 rounded-xl p-3 mt-3">
<input id="xf" type="range" min="0" max="100" value="50" class="w-full accent-yellow-400 h-6" oninput="doMix(this.value)">
<div class="grid grid-cols-3 gap-2 mt-2">
<button onclick="doMix(0)" class="bg-yellow-400 text-black py-2 rounded-full text-[10px] font-black">ONLY A</button>
<button onclick="autoMix()" class="bg-white text-black py-2 rounded-full text-[10px] font-black">AUTO</button>
<button onclick="doMix(100)" class="bg-zinc-700 py-2 rounded-full text-[10px]">ONLY B</button>
</div>
<div class="grid grid-cols-2 gap-2 mt-2"><button onclick="playAll()" class="bg-green-600 py-3 rounded-xl font-black">▶ PLAY</button><button onclick="pauseAll()" class="bg-zinc-800 py-3 rounded-xl font-black">⏸ PAUSE</button></div>
<p id="status" class="text-[10px] text-yellow-400 text-center mt-2">Ready - FIXED: old song stops!</p>
</div>

<div class="bg-zinc-900 rounded-xl p-3 mt-3">
<input id="ytInput" class="w-full p-3 rounded-xl bg-black border border-zinc-700 text-xs" placeholder="YouTube link">
<div class="grid grid-cols-2 gap-2 mt-2"><button onclick="loadYT('A')" class="bg-yellow-400 text-black py-3 rounded-full font-black text-xs">LOAD YT TO A - STOPS OLD</button><button onclick="loadYT('B')" class="bg-zinc-800 py-3 rounded-full font-black text-xs">LOAD YT TO B - STOPS OLD</button></div>
<div class="grid grid-cols-2 gap-2 mt-2">
<button onclick="document.getElementById('fA').click()" class="bg-black border-2 border-yellow-400 py-3 rounded-full text-[11px] font-black">📁 NEW SONG A</button>
<button onclick="document.getElementById('fB').click()" class="bg-black border border-zinc-600 py-3 rounded-full text-[11px]">📁 NEW SONG B</button>
</div>
<input type="file" id="fA" accept="video/*,audio/*" hidden><input type="file" id="fB" accept="video/*,audio/*" hidden>
</div>

<script>
function enableBG(){
 if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:'VIDEO MIX FIXED',artist:'BuildAI DJ'}); navigator.mediaSession.setActionHandler('play',playAll); navigator.mediaSession.setActionHandler('pause',pauseAll);}
 document.getElementById('bgStatus').innerText='✅ BG ON'; document.getElementById('bgBtn').innerText='✅ BG ENABLED';
}

// 🔥 THIS FIXES OLD SONG BUG - STOPS EVERYTHING ON THAT DECK
function stopDeck(deck){
 if(deck==='A'){
  // Stop videos
  try{document.getElementById('vidA').pause();}catch(e){} try{document.getElementById('mVidA').pause();}catch(e){}
  // Stop audios
  try{document.getElementById('audA').pause(); document.getElementById('audA').currentTime=0; document.getElementById('audA').src='';}catch(e){}
  // Stop YouTube by clearing src then reload
  try{document.getElementById('vidA').src='';}catch(e){}
  document.getElementById('lblA').innerText='Loading new...';
 }else{
  try{document.getElementById('vidB').pause();}catch(e){} try{document.getElementById('mVidB').pause();}catch(e){}
  try{document.getElementById('audB').pause(); document.getElementById('audB').currentTime=0; document.getElementById('audB').src='';}catch(e){}
  try{document.getElementById('vidB').src='';}catch(e){}
  document.getElementById('lblB').innerText='Loading new...';
 }
}

function getId(url){let m=url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null;}

function loadYT(deck){
 let url=document.getElementById('ytInput').value.trim(); let id=getId(url); if(!id){status.innerText='❌ Bad link';return;}
 stopDeck(deck); // 🔥 STOP OLD SONG FIRST!
 setTimeout(()=>{
  if(deck==='A'){
   document.getElementById('ytA').src='https://www.youtube.com/embed/'+id+'?autoplay=1';
   document.getElementById('mYtA').src='https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1';
   document.getElementById('ytA').classList.remove('hidden'); document.getElementById('vidA').classList.add('hidden');
   document.getElementById('mYtA').classList.remove('hidden'); document.getElementById('mVidA').classList.add('hidden');
   document.getElementById('lblA').innerText='YT: '+id;
  }else{
   document.getElementById('ytB').src='https://www.youtube.com/embed/'+id+'?autoplay=1';
   document.getElementById('mYtB').src='https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1';
   document.getElementById('ytB').classList.remove('hidden'); document.getElementById('vidB').classList.add('hidden');
   document.getElementById('mYtB').classList.remove('hidden'); document.getElementById('mVidB').classList.add('hidden');
   document.getElementById('lblB').innerText='YT: '+id;
  }
  status.innerText='✅ Deck '+deck+' NEW song - OLD STOPPED!';
  enableBG();
 },100);
}

document.getElementById('fA').onchange=e=>{
 let f=e.target.files[0]; if(!f)return;
 stopDeck('A'); // 🔥 STOP OLD!
 setTimeout(()=>{
  let url=URL.createObjectURL(f);
  if(f.type.startsWith('video')){
   document.getElementById('vidA').src=url; document.getElementById('mVidA').src
