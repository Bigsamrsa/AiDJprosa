<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BuildAI DJ - YT FIXED</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<style>body{background:#000;color:#FFD600;font-family:sans-serif}</style>
</head><body class="p-3">
<h1 class="text-2xl font-black">BuildAI DJ - YOUTUBE FIXED 🔥</h1>
<div class="grid grid-cols-2 gap-2 my-3">
<div class="bg-zinc-900 p-2 rounded"><div id="pA" class="aspect-video bg-black rounded flex items-center justify-center text-xs">DECK A</div><button onclick="players.A&&players.A.playVideo()" class="w-full mt-2 bg-yellow-400 text-black py-2 rounded font-black">▶ A PLAY</button></div>
<div class="bg-zinc-900 p-2 rounded"><div id="pB" class="aspect-video bg-black rounded flex items-center justify-center text-xs">DECK B</div><button onclick="players.B&&players.B.playVideo()" class="w-full mt-2 bg-yellow-400 text-black py-2 rounded font-black">▶ B PLAY</button></div>
</div>
<div class="bg-zinc-900 p-3 rounded my-3">
<input id="yt" class="w-full p-3 rounded bg-black border-zinc-700 text-yellow-400" placeholder="Paste YouTube link here">
<div class="grid grid-cols-2 gap-2 mt-2">
<button onclick="loadYT('A')" class="bg-yellow-400 text-black py-3 rounded font-black">LOAD TO A</button>
<button onclick="loadYT('B')" class="bg-zinc-800 text-white py-3 rounded font-black">LOAD TO B</button>
</div>
<div id="status" class="mt-2 text-xs font-bold">✅ Ready - Paste YouTube link</div>
<input id="cross" type="range" min="0" max="100" value="50" class="w-full mt-3 accent-yellow-400" oninput="mix(this.value)">
</div>
<script>
let players={};function getId(u){let m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);return m?m[1]:u.trim().slice(-11)}
function loadYT(d){let u=document.getElementById('yt').value;let id=getId(u);if(!id)return alert('Bad link');document.getElementById('status').innerText='Loading '+id+' to '+d;if(players[d])try{players[d].destroy()}catch(e){};players[d]=new YT.Player('p'+d,{videoId:id,playerVars:{playsinline:1,origin:location.origin},events:{onReady:e=>{e.target.setVolume(d=='A'?100:100);document.getElementById('status').innerText='✅ Loaded! Tap PLAY'}}})}
function mix(v){v=parseInt(v);if(players.A)players.A.setVolume(100-v);if(players.B)players.B.setVolume(v)}
function onYouTubeIframeAPIReady(){document.getElementById('status').innerText='✅ YouTube API Ready - Paste link!'}
</script>
</body></html>
